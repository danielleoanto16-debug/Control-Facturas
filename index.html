<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Facturas y Proyectos</title>

  <!-- Configuración PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FacturasApp">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">

  <!-- Librería para generar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- SDKs de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin:0; background:#f2f2f7; color: #1c1c1e; }
    header { background:#007aff; color:white; padding:15px 10px; text-align:center; }
    header h1 { font-size: 20px; margin: 0; }

    .ventana { display:none; padding:15px; width: 100%; max-width: 850px; margin: 0 auto; min-height:100vh; }
    .ventana.activa { display:block; }
    
    .opcion { background:white; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.08);
              margin:12px 0; padding:18px; text-align:center; font-size:16px; font-weight: 500; cursor:pointer; }
    .opcion:hover { background: #f9f9fb; }
    
    button { margin:4px 2px; padding:9px 12px; border:none; border-radius:8px; background:#007aff; color:white; cursor:pointer; font-weight: 600; font-size:13px; }
    button:hover { opacity: 0.9; }
    button.secundario { background: #8e8e93; }
    button.peligro { background: #ff3b30; }
    button.exito { background: #34c759; }
    button.imprimir { background: #5856d6; }
    button.sm { padding: 6px 10px; font-size: 12px; }

    input { margin:6px 0; padding:10px; border-radius:8px; border:1px solid #ccc; width:100%; font-size: 14px; }
    label { font-size: 13px; font-weight: 600; color: #444; margin-top: 6px; display: block; }
    
    .grid-inputs { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 12px 0; background: #eef5ff; padding: 12px; border-radius: 10px; border: 1px solid #b3d7ff; }
    @media (min-width: 600px) {
      .grid-inputs { grid-template-columns: 2fr 1fr 1fr auto; align-items: end; }
    }

    .factura-fields { display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 500px) {
      .factura-fields { grid-template-columns: 1fr 1fr 1fr; }
    }

    .tabla-contenedor { width: 100%; overflow-x: auto; margin: 10px 0 15px 0; border-radius: 10px; border: 1px solid #e5e5ea; background: white; -webkit-overflow-scrolling: touch; }
    table { width:100%; border-collapse:collapse; min-width: 450px; }
    th { background:#007aff; color:white; padding:10px 6px; font-size:13px; }
    td { border-bottom:1px solid #e5e5ea; border-right:1px solid #e5e5ea; padding:6px; text-align:center; font-size:13px; }
    td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }
    td input { margin:0; text-align:center; padding: 6px 4px; }

    tr {
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .caja-titulo-proyecto {
      text-align: center;
      background: #ffffff;
      border: 2px solid #007aff;
      border-radius: 12px;
      padding: 12px;
      margin: 15px 0;
      word-break: break-word;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .caja-titulo-proyecto .obra {
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      color: #007aff;
    }
    .caja-titulo-proyecto .lugar {
      font-size: 14px;
      color: #555;
      margin-top: 4px;
      font-weight: 600;
    }
    @media (min-width: 600px) {
      .caja-titulo-proyecto .obra { font-size: 22px; }
      .caja-titulo-proyecto .lugar { font-size: 16px; }
    }

    .factura { 
      margin:15px 0; 
      padding:14px; 
      border:1px solid #d1d1d6; 
      border-radius:12px; 
      background:white; 
      box-shadow:0 2px 6px rgba(0,0,0,0.05); 
      page-break-inside: avoid; 
      break-inside: avoid; 
    }
    .factura-header { display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #007aff; padding-bottom: 8px; margin-bottom: 12px; flex-wrap: wrap; gap: 5px; }
    
    ul { list-style: none; padding: 0; }
    li { background: white; padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e5e5ea; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

    .resumen-total {
      text-align: right;
      font-size: 16px;
      background: white;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #34c759;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .banner-instalacion {
      display: none;
      background: #007aff;
      color: white;
      padding: 12px;
      text-align: center;
      border-radius: 10px;
      margin: 10px 0;
      font-weight: 500;
    }

    .generando-pdf input[type="date"]::-webkit-calendar-picker-indicator,
    .generando-pdf input[type="date"]::-webkit-inner-spin-button {
      display: none !important;
      -webkit-appearance: none !important;
    }

    @media print {
      input[type="date"]::-webkit-calendar-picker-indicator,
      input[type="date"]::-webkit-inner-spin-button {
        display: none !important;
        -webkit-appearance: none !important;
      }

      body { background: white !important; color: black !important; }
      header, button, .no-print, .grid-inputs, .banner-instalacion { display: none !important; }
      .ventana { display: block !important; padding: 0 !important; max-width: 100% !important; }
      .ventana:not(.activa) { display: none !important; }
      
      .caja-titulo-proyecto {
        border: 2px solid #000 !important;
        background: #f8f8fb !important;
        border-radius: 12px !important;
        color: #000 !important;
      }
      .caja-titulo-proyecto .obra { color: #000 !important; }

      .factura { 
        border: 1px solid #999 !important; 
        border-radius: 12px !important; 
        box-shadow: none !important; 
        page-break-inside: avoid !important; 
        break-inside: avoid !important;
        margin-bottom: 20px; 
      }

      .tabla-contenedor { border: 1px solid #999 !important; border-radius: 10px !important; }
      table { min-width: 100% !important; }
      th { background-color: #eee !important; color: #000 !important; border-bottom: 1px solid #999 !important; }
      td { border-bottom: 1px solid #eee !important; border-right: 1px solid #eee !important; }

      .resumen-total {
        border: 2px solid #000 !important;
        border-radius: 12px !important;
        background: #f8f8fb !important;
      }

      input { border: none !important; background: transparent !important; font-weight: bold; width: auto !important; padding:0 !important; }
    }
  </style>
</head>
<body>
  <header class="no-print">
    <h1>📊 Control de Facturas y Materiales</h1>
  </header>

  <div id="bannerInstalacion" class="banner-instalacion no-print">
    📲 ¡Puedes instalar esta App en tu teléfono!
    <button onclick="instalarPWA()" class="exito sm" style="margin-left:8px;">Instalar</button>
  </div>

  <div id="inicio" class="ventana activa">
    <h2 style="text-align: center;">Menú Principal</h2>
    <div class="opcion" onclick="abrirVentana('nuevoProyecto')">📂 Nuevo Proyecto</div>
    <div class="opcion" onclick="abrirVentana('lista')">📋 Proyectos en Ejecución</div>
    <div class="opcion" onclick="abrirVentana('finalizados')">✅ Proyectos Finalizados</div>
  </div>

  <div id="nuevoProyecto" class="ventana">
    <button class="secundario no-print" onclick="abrirVentana('inicio')">← Inicio</button>
    <h2>Crear Proyecto</h2>
    
    <label for="lugarProyecto">Nombre del lugar / Ubicación:</label>
    <input id="lugarProyecto" placeholder="Ej. Cojutepeque, San Salvador...">

    <label for="obraProyecto">Obra a ejecutar:</label>
    <input id="obraProyecto" placeholder="Ej. Cielos Falsos, Instalación Eléctrica...">

    <button onclick="guardarNombreProyecto()" style="width: 100%; margin-top: 15px; padding: 12px;">Guardar y Continuar</button>
  </div>

  <div id="materiales" class="ventana">
    <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap: wrap; gap: 8px;">
      <button class="secundario" id="btnVolverAtras" onclick="abrirVentana('lista')">← Volver</button>
      <button class="imprimir" onclick="descargarPDFDirecto()">📄 Descargar PDF</button>
    </div>

    <div id="tituloProyectoActual" class="caja-titulo-proyecto">
      <div class="obra" id="dispObra">OBRA</div>
      <div class="lugar" id="dispLugar">Lugar</div>
    </div>

    <button class="no-print" id="btnNuevaFactura" onclick="nuevaFactura()" style="width: 100%;">➕ Agregar Nueva Factura</button>
    <div id="listaFacturas"></div>

    <div class="resumen-total">
      <strong>Total General del Proyecto: $<span id="totalProyecto">0.00</span></strong>
    </div>
  </div>

  <div id="lista" class="ventana">
    <button class="secundario no-print" onclick="abrirVentana('inicio')">← Inicio</button>
    <h2>Proyectos en Ejecución</h2>
    <ul id="listaProyectos"></ul>
  </div>

  <div id="finalizados" class="ventana">
    <button class="secundario no-print" onclick="abrirVentana('inicio')">← Inicio</button>
    <h2>Proyectos Finalizados</h2>
    <ul id="listaFinalizados"></ul>
  </div>

<script>
  // CONFIGURACIÓN DE FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyAdNI8meYRmIXhpoB-8eVt_EJLWlvmUXg8",
    authDomain: "control-facturas-ab8db.firebaseapp.com",
    projectId: "control-facturas-ab8db",
    storageBucket: "control-facturas-ab8db.firebasestorage.app",
    messagingSenderId: "531717630870",
    appId: "1:531717630870:web:0785a0089846f2e02bcbb7",
    measurementId: "G-4HH4VJ5DPH"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // REGISTRO DEL SERVICE WORKER
  let deferredPrompt;
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registrado con éxito', reg))
        .catch(err => console.log('Error al registrar Service Worker', err));
    });
  }

  // EVENTO DE INSTALACIÓN PWA
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const banner = document.getElementById('bannerInstalacion');
    if (banner) banner.style.display = 'block';
  });

  function instalarPWA() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          document.getElementById('bannerInstalacion').style.display = 'none';
        }
        deferredPrompt = null;
      });
    }
  }

  // LÓGICA DE LA APLICACIÓN
  let proyectos = JSON.parse(localStorage.getItem('proyectos_activos')) || [];
  let finalizados = JSON.parse(localStorage.getItem('proyectos_finalizados')) || [];
  let proyectoActual = null;
  let origenVista = 'lista';

  // ESCUCHADORES EN TIEMPO REAL CON FIREBASE
  db.ref('proyectos_activos').on('value', (snapshot) => {
    const data = snapshot.val();
    proyectos = data ? data : [];
    localStorage.setItem('proyectos_activos', JSON.stringify(proyectos));
    if(document.getElementById('lista').classList.contains('activa')) actualizarLista();
  });

  db.ref('proyectos_finalizados').on('value', (snapshot) => {
    const data = snapshot.val();
    finalizados = data ? data : [];
    localStorage.setItem('proyectos_finalizados', JSON.stringify(finalizados));
    if(document.getElementById('finalizados').classList.contains('activa')) actualizarFinalizados();
  });

  function guardarEnStorage() {
    localStorage.setItem('proyectos_activos', JSON.stringify(proyectos));
    localStorage.setItem('proyectos_finalizados', JSON.stringify(finalizados));
    db.ref('proyectos_activos').set(proyectos);
    db.ref('proyectos_finalizados').set(finalizados);
  }

  function abrirVentana(id){
    document.querySelectorAll('.ventana').forEach(v=>v.classList.remove('activa'));
    document.getElementById(id).classList.add('activa');
    if(id === 'lista') actualizarLista();
    if(id === 'finalizados') actualizarFinalizados();
  }

  function guardarNombreProyecto(){
    const inputLugar = document.getElementById('lugarProyecto');
    const inputObra = document.getElementById('obraProyecto');
    
    const lugar = inputLugar.value.trim();
    const obra = inputObra.value.trim();

    if(lugar && obra){
      proyectoActual = {
        lugar: lugar,
        obra: obra,
        nombre: `${obra} (${lugar})`,
        facturas:[], 
        total:0
      };
      proyectos.push(proyectoActual);
      guardarEnStorage();
      inputLugar.value = "";
      inputObra.value = "";
      origenVista = 'lista';
      abrirVentana('materiales');
      cargarVistaMateriales();
    } else {
      alert("Por favor completa el nombre del lugar y la obra a ejecutar.");
    }
  }

  function cargarVistaMateriales(){
    if(!proyectoActual) return;
    
    const obraTxt = proyectoActual.obra || proyectoActual.nombre || 'OBRA SIN NOMBRE';
    const lugarTxt = proyectoActual.lugar ? `📍 LUGAR: ${proyectoActual.lugar.toUpperCase()}` : '';

    document.getElementById('dispObra').innerText = `OBRA: ${obraTxt.toUpperCase()}`;
    document.getElementById('dispLugar').innerText = lugarTxt;
    
    const btnVolver = document.getElementById('btnVolverAtras');
    btnVolver.onclick = () => abrirVentana(origenVista);
    
    const esFinalizado = finalizados.some(p => p.nombre === proyectoActual.nombre && p.lugar === proyectoActual.lugar);
    document.getElementById('btnNuevaFactura').style.display = esFinalizado ? 'none' : 'block';

    recalcularTotales();
    mostrarFacturas();
  }

  function nuevaFactura(){
    const factura = {numFactura:"", lugar:"", fecha:"", materiales:[], total:0};
    proyectoActual.facturas.push(factura);
    guardarEnStorage();
    mostrarFacturas();
  }

  function eliminarFactura(fIndex){
    if(confirm(`¿Estás seguro de eliminar la Factura #${fIndex + 1}?`)){
      proyectoActual.facturas.splice(fIndex, 1);
      recalcularTotales();
      guardarEnStorage();
      mostrarFacturas();
    }
  }

  function actualizarDatosFactura(index, campo, valor) {
    proyectoActual.facturas[index][campo] = valor;
    guardarEnStorage();
  }

  function agregarMaterial(index){
    const inputMat = document.getElementById(`material${index}`);
    const inputVal = document.getElementById(`valor${index}`);
    const inputCant = document.getElementById(`cantidad${index}`);

    const material = inputMat.value.trim();
    const valor = parseFloat(inputVal.value);
    const cantidad = parseFloat(inputCant.value);

    if(material && !isNaN(valor) && !isNaN(cantidad)){
      const total = valor * cantidad;
      proyectoActual.facturas[index].materiales.push({material, valor, cantidad, total});
      
      recalcularTotales();
      guardarEnStorage();
      mostrarFacturas();

      const nuevoInputMat = document.getElementById(`material${index}`);
      if(nuevoInputMat) nuevoInputMat.focus();
    } else {
      alert("Por favor ingresa el nombre del material, precio unitario y cantidad.");
    }
  }

  function editarMaterial(fIndex, mIndex, campo, valor){
    const mat = proyectoActual.facturas[fIndex].materiales[mIndex];
    if(campo === 'material') mat.material = valor;
    if(campo === 'valor') mat.valor = parseFloat(valor) || 0;
    if(campo === 'cantidad') mat.cantidad = parseFloat(valor) || 0;
    
    mat.total = mat.valor * mat.cantidad;
    recalcularTotales();
    guardarEnStorage();
    mostrarFacturas();
  }

  function eliminarMaterial(fIndex, mIndex){
    proyectoActual.facturas[fIndex].materiales.splice(mIndex, 1);
    recalcularTotales();
    guardarEnStorage();
    mostrarFacturas();
  }

  function recalcularTotales(){
    if(!proyectoActual) return;
    let totalProyecto = 0;
    proyectoActual.facturas.forEach(f => {
      let totalFactura = 0;
      if(f.materiales) {
        f.materiales.forEach(m => {
          m.total = (m.valor || 0) * (m.cantidad || 0);
          totalFactura += m.total;
        });
      }
      f.total = totalFactura;
      totalProyecto += totalFactura;
    });
    proyectoActual.total = totalProyecto;
    document.getElementById('totalProyecto').innerText = proyectoActual.total.toFixed(2);
  }

  function mostrarFacturas(){
    const contenedor = document.getElementById('listaFacturas');
    contenedor.innerHTML = "";
    
    if(!proyectoActual.facturas || proyectoActual.facturas.length === 0){
      contenedor.innerHTML = "<p style='text-align:center; color:#8e8e93;'>No hay facturas registradas en este proyecto.</p>";
      return;
    }

    proyectoActual.facturas.forEach((f, fIndex)=>{
      const div = document.createElement('div');
      div.className = "factura";
      
      let htmlMateriales = "";
      if(f.materiales) {
        f.materiales.forEach((m, mIndex)=>{
          htmlMateriales += `<tr>
            <td><input value="${m.material}" onchange="editarMaterial(${fIndex}, ${mIndex}, 'material', this.value)"></td>
            <td><input type="number" step="0.01" value="${m.valor}" onchange="editarMaterial(${fIndex}, ${mIndex}, 'valor', this.value)" style="width:70px;"></td>
            <td><input type="number" step="1" value="${m.cantidad}" onchange="editarMaterial(${fIndex}, ${mIndex}, 'cantidad', this.value)" style="width:55px;"></td>
            <td>$${m.total.toFixed(2)}</td>
            <td class="no-print"><button class="peligro sm" onclick="eliminarMaterial(${fIndex}, ${mIndex})">🗑️</button></td>
          </tr>`;
        });
      }

      div.innerHTML = `
        <div class="factura-header">
          <strong>Factura #${fIndex+1}</strong>
          <button class="peligro sm no-print" onclick="eliminarFactura(${fIndex})">🗑️ Eliminar Factura</button>
        </div>
        
        <div class="factura-fields">
          <div><label style="font-size:11px; color:#666;">N° Factura:</label><input id="numFactura${fIndex}" placeholder="Ej. F-001" value="${f.numFactura || ''}" onchange="actualizarDatosFactura(${fIndex}, 'numFactura', this.value)"></div>
          <div><label style="font-size:11px; color:#666;">Proveedor/Lugar:</label><input id="lugar${fIndex}" placeholder="Ej. Ferretería" value="${f.lugar || ''}" onchange="actualizarDatosFactura(${fIndex}, 'lugar', this.value)"></div>
          <div><label style="font-size:11px; color:#666;">Fecha:</label><input id="fecha${fIndex}" type="date" value="${f.fecha || ''}" onchange="actualizarDatosFactura(${fIndex}, 'fecha', this.value)"></div>
        </div>

        <div class="grid-inputs no-print">
          <div>
            <label style="font-size:11px; color:#007aff; margin:0 0 2px 0;">Nuevo Material:</label>
            <input id="material${fIndex}" placeholder="Ej: Cemento, Clavos...">
          </div>
          <div>
            <label style="font-size:11px; color:#007aff; margin:0 0 2px 0;">Precio U. ($):</label>
            <input id="valor${fIndex}" type="number" step="0.01" placeholder="0.00">
          </div>
          <div>
            <label style="font-size:11px; color:#007aff; margin:0 0 2px 0;">Cantidad:</label>
            <input id="cantidad${fIndex}" type="number" step="1" placeholder="0">
          </div>
          <div>
            <button onclick="agregarMaterial(${fIndex})" style="width: 100%; height: 40px; margin-top: 6px;">➕ Añadir</button>
          </div>
        </div>

        <h4 style="margin-top:10px; margin-bottom:5px; font-size:14px;">Materiales Registrados:</h4>
        <div class="tabla-contenedor">
          <table>
            <thead>
              <tr>
                <th>Material</th>
                <th>Precio U. ($)</th>
                <th>Cant.</th>
                <th>Subtotal</th>
                <th class="no-print">Acción</th>
              </tr>
            </thead>
            <tbody>${htmlMateriales}</tbody>
          </table>
        </div>
        
        <p style="text-align:right; font-weight:bold; font-size:14px; margin-top:10px;">Total Factura: $${(f.total || 0).toFixed(2)}</p>
      `;
      contenedor.appendChild(div);
    });
  }

  function actualizarLista(){
    const lista = document.getElementById('listaProyectos');
    lista.innerHTML = "";
    if(proyectos.length === 0) {
      lista.innerHTML = "<li style='justify-content:center; color:#8e8e93;'>No hay proyectos en ejecución.</li>";
      return;
    }
    proyectos.forEach((p, index)=>{
      const li = document.createElement('li');
      const obraMostrar = p.obra || p.nombre || 'Sin Nombre';
      const lugarMostrar = p.lugar ? `<small style="color:#007aff;">📍 ${p.lugar}</small><br>` : '';

      li.innerHTML = `
        <div>
          <strong>${obraMostrar}</strong><br>
          ${lugarMostrar}
          <small style="color:#666;">Total gastado: $${(p.total || 0).toFixed(2)}</small>
        </div>
        <div>
          <button onclick="abrirProyecto(${index}, 'lista')">📂 Abrir</button>
          <button class="exito" onclick="finalizarProyecto(${index})">✅ Finalizar</button>
          <button class="peligro" onclick="eliminarProyecto(${index}, 'activos')">🗑️</button>
        </div>
      `;
      lista.appendChild(li);
    });
  }

  function abrirProyecto(index, origen){
    origenVista = origen;
    proyectoActual = (origen === 'lista') ? proyectos[index] : finalizados[index];
    abrirVentana('materiales');
    cargarVistaMateriales();
  }

  function finalizarProyecto(index){
    const p = proyectos[index];
    const titulo = p.obra ? `${p.obra} (${p.lugar})` : p.nombre;
    if(confirm(`¿Estás seguro de finalizar el proyecto "${titulo}"?`)){
      finalizados.push(proyectos[index]);
      proyectos.splice(index, 1);
      guardarEnStorage();
      actualizarLista();
    }
  }

  function actualizarFinalizados(){
    const lista = document.getElementById('listaFinalizados');
    lista.innerHTML = "";
    if(finalizados.length === 0) {
      lista.innerHTML = "<li style='justify-content:center; color:#8e8e93;'>No hay proyectos finalizados.</li>";
      return;
    }
    finalizados.forEach((p, index)=>{
      const li = document.createElement('li');
      const obraMostrar = p.obra || p.nombre || 'Sin Nombre';
      const lugarMostrar = p.lugar ? `<small style="color:#007aff;">📍 ${p.lugar}</small><br>` : '';

      li.innerHTML = `
        <div>
          <strong>${obraMostrar}</strong><br>
          ${lugarMostrar}
          <small style="color:#666;">Total final: $${(p.total || 0).toFixed(2)}</small>
        </div>
        <div>
          <button class="imprimir" onclick="abrirProyecto(${index}, 'finalizados')">👁️ Ver Detalle</button>
          <button class="secundario" onclick="reabrirProyecto(${index})">🔄 Reabrir</button>
          <button class="peligro" onclick="eliminarProyecto(${index}, 'finalizados')">🗑️</button>
        </div>
      `;
      lista.appendChild(li);
    });
  }

  function reabrirProyecto(index){
    const p = finalizados[index];
    const titulo = p.obra ? `${p.obra} (${p.lugar})` : p.nombre;
    if(confirm(`¿Deseas reactivar el proyecto "${titulo}"?`)){
      proyectos.push(finalizados[index]);
      finalizados.splice(index, 1);
      guardarEnStorage();
      actualizarFinalizados();
    }
  }

  function eliminarProyecto(index, tipo){
    const listaTarget = (tipo === 'activos') ? proyectos : finalizados;
    const p = listaTarget[index];
    const titulo = p.obra ? `${p.obra} (${p.lugar})` : p.nombre;

    if(confirm(`¿Estás seguro de ELIMINAR PERMANENTEMENTE el proyecto "${titulo}"?`)){
      listaTarget.splice(index, 1);
      guardarEnStorage();
      if(tipo === 'activos') actualizarLista();
      else actualizarFinalizados();
    }
  }

  function descargarPDFDirecto(){
    if(!proyectoActual) return;
    
    const contenedor = document.getElementById('materiales');
    contenedor.classList.add('generando-pdf');
    
    if (typeof html2pdf !== 'undefined') {
      const elementosNoPrint = contenedor.querySelectorAll('.no-print');
      elementosNoPrint.forEach(el => el.style.visibility = 'hidden');

      const nombreArchivo = (proyectoActual.obra || 'Proyecto').replace(/\s+/g, '_');

      const configuracion = {
        margin:       8,
        filename:     `Facturas_${nombreArchivo}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
      };

      html2pdf().set(configuracion).from(contenedor).save().then(() => {
        elementosNoPrint.forEach(el => el.style.visibility = 'visible');
        contenedor.classList.remove('generando-pdf');
      });
    } else {
      window.print();
      contenedor.classList.remove('generando-pdf');
    }
  }
</script>
</body>
</html>
